name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: ./gradlew buildAndCollect --no-daemon --console=plain
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JDK21,JDK25
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockd-all-versions
          path: build/libs/
          if-no-files-found: error

  gametest:
    name: gametest (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [1.21.1-neoforge, 1.21.11-neoforge, 26.1.2-neoforge, 26.2-neoforge]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run game tests
        run: ./gradlew :${{ matrix.version }}:runGameTestServer --no-daemon --console=plain
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JDK21,JDK25
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}
