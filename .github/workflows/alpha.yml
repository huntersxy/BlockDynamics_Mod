name: Alpha to Modrinth

# 推送 multiversion 分支时自动发布全部版本的 alpha 到 Modrinth。
# 分支改名后请同步修改下面的 branches 列表。
on:
  push:
    branches: [multiversion]
  workflow_dispatch:

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine alpha version
        id: version
        run: |
          BASE_VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          echo "alpha_version=${BASE_VER}-alpha.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Base version: ${BASE_VER}, alpha version: ${BASE_VER}-alpha.${SHORT_SHA}"

      - name: Build all versions
        run: ./gradlew buildAndCollect -Pmod_version="${{ steps.version.outputs.alpha_version }}" --no-daemon --console=plain
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JDK21,JDK25
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}

      - name: Publish alphas to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ALPHA_VERSION: ${{ steps.version.outputs.alpha_version }}
        run: |
          set -e
          # 每个游戏版本发布一个 alpha（同一 alpha 版本号，游戏版本分开）
          # <mc>|<game_version>
          VERSIONS="1.21.1|1.21.1
          1.21.11|1.21.11
          26.1|26.1"
          FAILED=0
          echo "$VERSIONS" | while IFS='|' read -r DIR MC; do
            JAR=$(ls build/libs/${DIR}/blockd-*.jar | grep -v sources | head -1 || true)
            if [ -z "$JAR" ]; then echo "!! No jar for ${DIR}"; FAILED=1; continue; fi
            echo "Uploading ${JAR} (game ${MC}) as ${ALPHA_VERSION}"
            jq -n --arg v "$ALPHA_VERSION" --arg sha "${{ github.sha }}" --arg mc "$MC" \
              '{project_id:"phZGXedL", name:("Entity Freezer & Limit breeding " + $v + " (" + $mc + ")"), version_number:($v + "+" + $mc), changelog:("Automatic alpha build from commit " + $sha), dependencies:[], game_versions:[$mc], release_channel:"alpha", loaders:["neoforge"], featured:false, status:"listed", file_parts:["jar"], primary_file:"jar"}' \
              > /tmp/alpha-data.json
            RESP=$(curl -s -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: Bearer ${MODRINTH_TOKEN}" \
              -H "User-Agent: blockd-alpha-ci" \
              -F "data=@/tmp/alpha-data.json" \
              -F "jar=@${JAR}")
            if echo "$RESP" | grep -q '"id"'; then
              echo "OK: $(echo "$RESP" | jq -r .version_number)"
            else
              echo "FAILED for ${MC}: $RESP"
              FAILED=1
            fi
          done
          exit $FAILED
