name: Alpha to Modrinth

# 推送 multiversion 分支时自动发布全部版本的 alpha 到 Modrinth。
# 平台更新日志读取仓库根目录 CHANGELOG.md 中 "## [版本号]" 对应小节。
# 旧 alpha 清理规则：
# - 基础版本与本次相同（同版本反复构建）→ 删除，只保留本次上传的；
# - 版本号跳变（如 1.8→1.9、1.8.1→1.8.2）→ 不删除：旧版本号下最新一组 alpha
#   晋级为 beta 通道（更新日志取 CHANGELOG.md 对应小节），更早的同版本 alpha 仍删除。
# 分支改名后请同步修改下面的 branches 列表。
on:
  push:
    branches: [multiversion]
  workflow_dispatch:

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine alpha version
        id: version
        run: |
          BASE_VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          echo "alpha_version=${BASE_VER}-alpha.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Base version: ${BASE_VER}, alpha version: ${BASE_VER}-alpha.${SHORT_SHA}"

      - name: Build all versions
        run: ./gradlew buildAndCollect -Pmod_version="${{ steps.version.outputs.alpha_version }}" --no-daemon --console=plain
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JDK21,JDK25
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}

      - name: Publish alphas to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ALPHA_VERSION: ${{ steps.version.outputs.alpha_version }}
        run: |
          set -e
          BASE_VER="${ALPHA_VERSION%-alpha.*}"

          # 提取 CHANGELOG.md 中 "## [<版本号>]" 小节（到下一个 ## [ 为止），无则输出空
          changelog_section() {
            [ -f CHANGELOG.md ] || return 0
            awk -v ver="$1" 'index($0, "## [" ver "]") == 1 { flag = 1; next } /^## \[/ { flag = 0 } flag { print }' CHANGELOG.md
          }

          # 平台更新日志：优先用 CHANGELOG.md 对应小节，缺失时回退为通用文案
          CHANGELOG_TEXT="Automatic alpha build from commit ${{ github.sha }}"
          SECTION=$(changelog_section "$BASE_VER")
          if [ -n "$SECTION" ]; then
            CHANGELOG_TEXT=$(printf '%s\n\n---\n自动 alpha 构建：commit %s' "$SECTION" "${{ github.sha }}")
          fi
          echo ">>> Changelog for ${BASE_VER}:"; echo "$CHANGELOG_TEXT"; echo "<<<"

          # 每个游戏版本发布一个 alpha（同一 alpha 版本号，游戏版本分开）
          # <mc>|<game_version>
          VERSIONS="1.21.1|1.21.1
          1.21.11|1.21.11
          26.1.2|26.1.2
          26.2|26.2"
          FAILED=0
          NEW_IDS=""
          # here-string 而非管道：避免 while 在子 shell 里运行导致变量丢失
          while IFS='|' read -r DIR MC; do
            JAR=$(ls build/libs/${DIR}/blockd-*.jar | grep -v sources | head -1 || true)
            if [ -z "$JAR" ]; then echo "!! No jar for ${DIR}"; FAILED=1; continue; fi
            echo "Uploading ${JAR} (game ${MC}) as ${ALPHA_VERSION}"
            jq -n --arg v "$ALPHA_VERSION" --arg sha "${{ github.sha }}" --arg mc "$MC" --arg changelog "$CHANGELOG_TEXT" \
              '{project_id:"phZGXedL", name:("Entity Freezer & Limit breeding " + $v + " (" + $mc + ")"), version_number:($v + "+" + $mc), changelog:$changelog, dependencies:[], game_versions:[$mc], release_channel:"alpha", loaders:["neoforge"], featured:false, status:"listed", file_parts:["jar"], primary_file:"jar"}' \
              > /tmp/alpha-data.json
            RESP=$(curl -s -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: Bearer ${MODRINTH_TOKEN}" \
              -H "User-Agent: blockd-alpha-ci" \
              -F "data=@/tmp/alpha-data.json" \
              -F "jar=@${JAR}")
            if echo "$RESP" | grep -q '"id"'; then
              ID=$(echo "$RESP" | jq -r .id)
              echo "OK: ${ID}"
              NEW_IDS="${NEW_IDS} ${ID}"
            else
              echo "FAILED for ${MC}: $RESP"
              FAILED=1
            fi
          done <<< "$VERSIONS"

          # ---------- 处理旧 alpha：版本号跳变检测 ----------
          echo "Handling previous alpha versions..."
          ALL=$(curl -s -H "Authorization: Bearer ${MODRINTH_TOKEN}" -H "User-Agent: blockd-alpha-ci" "https://api.modrinth.com/v2/project/phZGXedL/version")

          # 同基础版本的旧 alpha → 删除（排除本次刚上传的）
          echo "$ALL" | jq -r --arg base "$BASE_VER" \
            '.[] | select(.version_type == "alpha") | select(.version_number | startswith($base + "-alpha.")) | .id' \
            | while read -r OLD; do
              case " ${NEW_IDS} " in *" ${OLD} "*) continue ;; esac
              echo "Deleting superseded alpha ${OLD} (same base ${BASE_VER})"
              curl -s -X DELETE "https://api.modrinth.com/v2/version/${OLD}" \
                -H "Authorization: Bearer ${MODRINTH_TOKEN}" \
                -H "User-Agent: blockd-alpha-ci" || echo "  !! delete failed for ${OLD}"
            done

          # 旧基础版本的 alpha（版本号跳变）：
          # TSV 列 = date_added / alpha组标识(去掉+游戏版本) / 基础版本 / id / version_number
          echo "$ALL" | jq -r --arg base "$BASE_VER" \
            '.[] | select(.version_type == "alpha") | select((.version_number | startswith($base + "-alpha.")) | not)
             | [(.date_published // ""), (.version_number | sub("[+].*$"; "")), (.version_number | sub("-alpha[.].*$"; "")), .id, .version_number] | @tsv' \
            > /tmp/old-base-alphas.tsv

          if [ -s /tmp/old-base-alphas.tsv ]; then
            # 每个旧基础版本保留 date_added 最大的一组 alpha（ISO 时间戳可按字符串比较）
            KEEP_GROUPS=$(awk -F'\t' '{ if ($1 > max[$3]) { max[$3] = $1; best[$3] = $2 } } END { for (b in best) print best[b] }' /tmp/old-base-alphas.tsv)
            while IFS=$'\t' read -r DATE GROUP OLD_BASE OLDID VNUM; do
              if printf '%s\n' "$KEEP_GROUPS" | grep -Fxq "$GROUP"; then
                echo "Version jump ${OLD_BASE} -> ${BASE_VER}: promoting ${VNUM} (${OLDID}) to beta"
                PROMOTE_BODY='{"version_type":"beta"}'
                OLD_SECTION=$(changelog_section "$OLD_BASE")
                if [ -n "$OLD_SECTION" ]; then
                  PROMOTE_BODY=$(jq -n --arg c "$OLD_SECTION" '{version_type:"beta", changelog:$c}')
                fi
                RESP=$(curl -s -X PATCH "https://api.modrinth.com/v2/version/${OLDID}" \
                  -H "Authorization: Bearer ${MODRINTH_TOKEN}" \
                  -H "User-Agent: blockd-alpha-ci" \
                  -H "Content-Type: application/json" \
                  -d "$PROMOTE_BODY")
                if ! echo "$RESP" | grep -q '"id"'; then
                  echo "  !! promote failed for ${OLDID}: $RESP"
                fi
              else
                echo "Deleting older alpha ${VNUM} (${OLDID}) of old base ${OLD_BASE}"
                curl -s -X DELETE "https://api.modrinth.com/v2/version/${OLDID}" \
                  -H "Authorization: Bearer ${MODRINTH_TOKEN}" \
                  -H "User-Agent: blockd-alpha-ci" || echo "  !! delete failed for ${OLDID}"
              fi
            done < /tmp/old-base-alphas.tsv
          fi
          exit $FAILED
